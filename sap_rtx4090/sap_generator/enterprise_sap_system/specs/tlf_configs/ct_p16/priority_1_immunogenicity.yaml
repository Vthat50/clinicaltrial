      - "Titer from ADAB where PARAMCD = 'ADATITER'"
      - "Only include samples where AVAL > 0 (positive)"
      - "Log-transform for geometric mean: exp(mean(log(AVAL)))"
      - "CV% = 100 * sqrt(exp(variance of log-transformed) - 1)"
      - "Use PROC MEANS with geometric mean option"
      - "Maximum post-baseline: highest titer across all post-baseline visits"

