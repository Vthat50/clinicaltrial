      - symbol: ""
        text: "ADA Evaluable Population: Subjects with at least one evaluable ADA assessment."
      - symbol: "a"
        text: "Baseline defined as last non-missing ADA result prior to first dose of study drug."
      - symbol: "b"
        text: "Treatment-emergent ADA: ADA-negative at baseline and ADA-positive at any post-baseline timepoint."
      - symbol: "c"
        text: "Treatment-boosted ADA: ADA-positive at baseline with ≥4-fold increase in titer at any post-baseline timepoint."
      - symbol: "d"
        text: "Treatment-unaffected ADA: ADA-positive at baseline without significant increase post-baseline."
      - symbol: "e"
        text: "Overall ADA incidence = (Treatment-emergent + Treatment-boosted) / N evaluable."
      - symbol: "f"
        text: "95% CI computed using Clopper-Pearson exact method."

