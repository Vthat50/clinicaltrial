      - "ADA results from ADAB dataset"
      - "Baseline: ABLFL = 'Y'"
      - "Treatment-emergent: ADTEFFL = 'Y' (negative baseline, positive post)"
      - "Treatment-boosted: ADTBOFL = 'Y' (positive baseline, ≥4-fold increase)"
      - "Treatment-unaffected: positive baseline, no significant change"
      - "Overall incidence: ADAINCFL = 'Y' (TE or TB)"
      - "95% CI by Clopper-Pearson using PROC FREQ EXACT BINOMIAL"
      - "Visit-level summary by AVISITN"

