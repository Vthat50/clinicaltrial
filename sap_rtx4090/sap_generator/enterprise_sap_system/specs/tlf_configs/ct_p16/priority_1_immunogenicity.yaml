# CT-P16 Priority 1 Immunogenicity TLF Shells
# ============================================
# ADA and NAb incidence and titer summaries
# Per SAP Section 10.9: Immunogenicity Analysis

metadata:
  study: "CT-P16"
  indication: "Non-Small Cell Lung Cancer (NSCLC)"
  priority: 1
  category: "Immunogenicity"
  sap_sections: ["10.9"]

base_config: "../base_biosimilar_oncology.yaml"

