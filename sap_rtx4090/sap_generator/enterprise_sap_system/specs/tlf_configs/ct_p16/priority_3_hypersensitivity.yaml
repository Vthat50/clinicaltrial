# CT-P16 Priority 3 Hypersensitivity Monitoring TLF Shells
# ========================================================
# Infusion-Related Monitoring (Vital Signs and ECG)
# Per SAP Sections 10.4, 10.5: ECG and Hypersensitivity Monitoring

metadata:
  study: "CT-P16"
  indication: "Non-Small Cell Lung Cancer (NSCLC)"
  priority: 3
  category: "Hypersensitivity Monitoring"
  sap_sections: ["10.4", "10.5"]

base_config: "../base_biosimilar_oncology.yaml"

