# CT-P16 Priority 3 Laboratory TLF Shells
# ========================================
# Laboratory Actual Values, Change from Baseline, and Shift Tables
# Per SAP Section 10.2: Laboratory Evaluations

metadata:
  study: "CT-P16"
  indication: "Non-Small Cell Lung Cancer (NSCLC)"
  priority: 3
  category: "Laboratory"
  sap_sections: ["10.2"]

base_config: "../base_biosimilar_oncology.yaml"

# =============================================================================
# LABORATORY TABLES
# =============================================================================
