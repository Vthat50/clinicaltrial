# CT-P16 Priority 1 Efficacy TLF Shells
# ======================================
# Central vs. Local Review variants for all efficacy endpoints
# Per SAP Section 8: Efficacy Analysis

metadata:
  study: "CT-P16"
  indication: "Non-Small Cell Lung Cancer (NSCLC)"
  priority: 1
  category: "Efficacy"
  sap_sections: ["8.1", "8.2"]

base_config: "../base_biosimilar_oncology.yaml"

# =============================================================================
# TABLE 14.2.1: BEST OVERALL RESPONSE / ORR - INDUCTION PERIOD
# =============================================================================
# Note: Per SAP, ORR during Induction is the original primary endpoint
# (now sensitivity analysis for final CSR)

tables:
  # ---------------------------------------------------------------------------
  # 14.2.1.1: ORR Induction - ITT - Central Review
  # ---------------------------------------------------------------------------
  - number: "14.2.1.1"
    title: "Best Overall Response During Induction Study Period (ITT Population, Central Review)"
    tlf_type: TABLE
    population: ITT Population
    orientation: PORTRAIT

    columns:
      - header: "Response Category"
        width: 2.8
        alignment: L
        source_variable: null
      - header: "CT-P16\n(N=xxx)\nn (%)"
        width: 1.4
        alignment: C
        format: "xxx (xx.x)"
        source_variable: "ADRS.AVALC"
      - header: "EU-Approved Avastin\n(N=xxx)\nn (%)"
        width: 1.4
        alignment: C
        format: "xxx (xx.x)"
        source_variable: "ADRS.AVALC"

    stub_rows:
      - level: 0
        label: "Best Overall Response, n (%)"
        bold: true
        row_type: header
      - level: 1
        label: "Complete Response (CR)"
        bold: false
        row_type: data
      - level: 1
        label: "Partial Response (PR)"
        bold: false
        row_type: data
      - level: 1
        label: "Stable Disease (SD)"
        bold: false
        row_type: data
      - level: 1
        label: "Progressive Disease (PD)"
        bold: false
        row_type: data
      - level: 1
        label: "Not Evaluable (NE)"
        bold: false
        row_type: data
      - level: 0
        label: ""
        bold: false
        row_type: spacer
      - level: 0
        label: "Objective Response Rate (CR+PR)"
        bold: true
        row_type: total
      - level: 1
        label: "Responders, n (%)"
        bold: false
        row_type: data
      - level: 1
        label: "95% CI"
        bold: false
        row_type: data
      - level: 0
        label: ""
        bold: false
        row_type: spacer
      - level: 0
        label: "Risk Difference (CT-P16 - EU-Avastin)"
        bold: true
        row_type: header
      - level: 1
        label: "Difference (%)"
        bold: false
        row_type: data
      - level: 1
        label: "95% CI"
        bold: false
        row_type: data
      - level: 0
        label: ""
        bold: false
        row_type: spacer
      - level: 0
        label: "Disease Control Rate (CR+PR+SD)"
        bold: true
        row_type: total
      - level: 1
        label: "n (%)"
        bold: false
        row_type: data
      - level: 1
        label: "95% CI"
        bold: false
        row_type: data

    footnotes:
      - symbol: ""
        text: "ITT Population: All randomized subjects."
      - symbol: "a"
        text: "Per RECIST version 1.1 criteria based on central (IRC) review."
      - symbol: "b"
        text: "95% CI for response rate computed using Clopper-Pearson exact method."
      - symbol: "c"
        text: "Risk difference = CT-P16 - EU-Approved Avastin; 95% CI by Newcombe method."
      - symbol: "d"
        text: "Best overall response during Induction Study Period (Cycles 1-6)."

    source_dataset: "ADRS"
    filter_condition: "ITTFL = 'Y' and PARAMCD = 'BOR' and APTS = 'INDUCTION' and EVALBY = 'CENTRAL' and ANL01FL = 'Y'"
    sort_order: ["TRT01PN", "AVALC"]

    programming_notes:
      - "Population: ADSL where ITTFL = 'Y'"
      - "BOR from ADRS where PARAMCD = 'BOR' and APTS = 'INDUCTION'"
      - "Central review: EVALBY = 'CENTRAL'"
      - "ORR = (n CR + n PR) / N"
      - "Use PROC FREQ with EXACT BINOMIAL option for CI"
      - "Risk difference CI by Newcombe method using RISKDIFF option"
      - "This is a SENSITIVITY ANALYSIS for final CSR (per SAP Section 8.1)"

