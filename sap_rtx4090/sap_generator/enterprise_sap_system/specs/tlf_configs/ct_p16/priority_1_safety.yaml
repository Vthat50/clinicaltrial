# CT-P16 Priority 1 Safety TLF Shells
# ====================================
# TEAE Overview and AESI by Study Period
# Per SAP Section 10: Safety Analysis

metadata:
  study: "CT-P16"
  indication: "Non-Small Cell Lung Cancer (NSCLC)"
  priority: 1
  category: "Safety"
  sap_sections: ["10.1.1", "10.1.5"]

base_config: "../base_biosimilar_oncology.yaml"

