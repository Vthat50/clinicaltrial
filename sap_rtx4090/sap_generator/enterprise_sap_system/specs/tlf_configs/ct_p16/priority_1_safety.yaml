      - symbol: ""
        text: "Safety Population: All subjects who received at least one dose of study drug."
      - symbol: "a"
        text: "TEAEs defined as AEs with onset on or after first dose of study drug and within 28 days after the last dose or end of treatment, whichever is later."
      - symbol: "b"
        text: "Treatment-related per investigator assessment (related or possibly related)."
      - symbol: "c"
        text: "Subjects are counted once per category regardless of the number of events."
      - symbol: "d"
        text: "Severity graded per NCI CTCAE version 5.0."
      - symbol: ""
        text: "Percentages based on the number of subjects in each treatment group."

