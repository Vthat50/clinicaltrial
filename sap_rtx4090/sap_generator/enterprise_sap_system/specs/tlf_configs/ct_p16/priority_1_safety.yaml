    filter_condition: "SAFFL = 'Y' and TRTEMFL = 'Y'"
    sort_order: ["TRT01AN"]

    programming_notes:
      - "Population: ADSL where SAFFL = 'Y'"
      - "TEAEs: ADAE where TRTEMFL = 'Y'"
      - "Whole Study Period: All TEAEs regardless of study period"
      - "Count subjects once per category"
      - "Use worst grade for maximum severity"
      - "Treatment-related: AEREL in ('RELATED', 'POSSIBLY RELATED')"
      - "Serious: AESER = 'Y'"
      - "Leading to discontinuation: AEACN = 'DRUG WITHDRAWN'"
      - "Leading to interruption: AEACN = 'DRUG INTERRUPTED'"
      - "Leading to dose reduction: AEACN = 'DOSE REDUCED'"

