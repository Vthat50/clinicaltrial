    - "SCLC"
    - "breast cancer"
    - "HER2-positive breast cancer"
    - "triple-negative breast cancer"
    - "TNBC"
    - "HR+/HER2- breast cancer"
    - "colorectal cancer"
    - "CRC"
    - "gastric cancer"
    - "esophageal cancer"
    - "gastroesophageal junction"
    - "GEJ"
    - "hepatocellular carcinoma"
    - "HCC"
    - "renal cell carcinoma"
    - "RCC"
    - "urothelial carcinoma"
    - "bladder cancer"
    - "melanoma"
    - "head and neck squamous cell carcinoma"
    - "HNSCC"
    - "pancreatic cancer"
    - "ovarian cancer"
    - "cervical cancer"
    - "endometrial cancer"
    - "prostate cancer"
    - "mCRPC"
    - "mesothelioma"
    - "cholangiocarcinoma"
    - "thyroid cancer"
    - "sarcoma"
    - "glioblastoma"
    - "GBM"

  hematologic_malignancies:
    - "acute myeloid leukemia"
