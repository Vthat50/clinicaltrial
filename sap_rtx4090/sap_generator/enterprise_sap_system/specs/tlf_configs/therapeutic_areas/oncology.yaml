# =============================================================================
# ONCOLOGY THERAPEUTIC AREA CONFIGURATION
# =============================================================================
# Disease-specific vocabularies, endpoints, response criteria, and table
# structures unique to oncology clinical trials.
#
# Used by Claude to recognize oncology-specific concepts in protocols and
# map them to the correct analysis templates and table structures.
# =============================================================================

version: "1.0"
therapeutic_area: "oncology"
display_name: "Oncology"

