# Base Biosimilar Oncology TLF Configuration
# ============================================
# Reusable templates for biosimilar oncology studies
# Supports: Period stratification, Central/Local review, Immunogenicity

metadata:
  template_name: "Biosimilar Oncology"
  version: "1.0"
  applicable_to:
    - biosimilar
    - oncology
    - infused_biologic

# =============================================================================
# COMMON DEFINITIONS
# =============================================================================

study_periods:
  - id: whole
    name: "Whole Study Period"
    description: "From first dose to end of follow-up"
    filter_suffix: ""
  - id: induction
    name: "Induction Study Period"
    description: "Cycles 1-6 with chemotherapy"
    filter_suffix: "and APERIODC = 'INDUCTION'"
  - id: maintenance
    name: "Maintenance Study Period"
    description: "Monotherapy after induction"
    filter_suffix: "and APERIODC = 'MAINTENANCE'"
  - id: followup
    name: "Follow-up Period"
    description: "Post-treatment follow-up"
    filter_suffix: "and APERIODC = 'FOLLOW-UP'"

review_types:
  - id: central
    name: "Central Review"
    abbreviation: "IRC"
    description: "Independent Radiological Committee assessment"
    filter_suffix: "and EVALBY = 'CENTRAL'"
  - id: local
    name: "Local Review"
    abbreviation: "INV"
    description: "Investigator assessment"
    filter_suffix: "and EVALBY = 'LOCAL'"

populations:
  itt:
    name: "ITT Population"
    description: "All randomized subjects"
    filter: "ITTFL = 'Y'"
    dataset: "ADSL"
  pp:
    name: "PP Population"
    description: "Per-Protocol Population"
    filter: "PPROTFL = 'Y'"
    dataset: "ADSL"
  safety:
    name: "Safety Population"
    description: "All subjects who received at least one dose"
    filter: "SAFFL = 'Y'"
    dataset: "ADSL"
  pk:
    name: "PK Population"
    description: "Subjects with evaluable PK data"
    filter: "PKFL = 'Y'"
    dataset: "ADSL"
  ada:
    name: "ADA Population"
    description: "Subjects with at least one ADA assessment"
    filter: "ADAFL = 'Y'"
    dataset: "ADSL"

treatment_arms:
  test:
    name: "CT-P16"
    code: "CT-P16"
  reference:
    name: "EU-Approved Avastin"
    code: "AVASTIN"

# =============================================================================
# COLUMN TEMPLATES
# =============================================================================

column_templates:
  two_arm_counts:
    - header: ""
      width: 2.5
      alignment: L
      format: null
    - header: "CT-P16\n(N=xxx)\nn (%)"
      width: 1.3
      alignment: C
      format: "n (xx.x)"
    - header: "EU-Approved Avastin\n(N=xxx)\nn (%)"
      width: 1.3
      alignment: C
      format: "n (xx.x)"
    - header: "Total\n(N=xxx)\nn (%)"
      width: 1.3
      alignment: C
      format: "n (xx.x)"

  two_arm_with_diff:
    - header: ""
      width: 2.5
      alignment: L
      format: null
    - header: "CT-P16\n(N=xxx)"
      width: 1.3
      alignment: C
      format: null
    - header: "EU-Approved Avastin\n(N=xxx)"
      width: 1.3
      alignment: C
      format: null
    - header: "Difference\n(95% CI)"
      width: 1.5
      alignment: C
      format: "xx.x (xx.x, xx.x)"

  tte_summary:
    - header: "Parameter"
      width: 2.5
      alignment: L
      format: null
    - header: "CT-P16\n(N=xxx)"
      width: 1.8
      alignment: C
      format: null
    - header: "EU-Approved Avastin\n(N=xxx)"
      width: 1.8
      alignment: C
      format: null

# =============================================================================
# FOOTNOTE TEMPLATES
# =============================================================================

footnote_templates:
  teae_definition:
    symbol: "a"
    text: "TEAEs defined as AEs with onset on or after first dose of study drug and within 28 days after the last dose of study drug or end of treatment, whichever is later."

  treatment_related:
    symbol: "b"
    text: "Treatment-related per investigator assessment (related or possibly related)."

  subject_counting:
    symbol: "c"
    text: "Subjects are counted once per category regardless of the number of events."

  meddra_version:
    symbol: ""
    text: "MedDRA version 24.0 or higher coding dictionary."

  percentage_basis:
    symbol: ""
    text: "Percentages based on the number of subjects in each treatment group."

  recist_criteria:
    symbol: "a"
    text: "Per RECIST version 1.1 criteria."

  clopper_pearson:
    symbol: "b"
    text: "95% CI computed using Clopper-Pearson exact method."

  risk_difference:
    symbol: "c"
    text: "Risk difference = CT-P16 - EU-Approved Avastin; 95% CI by Newcombe method."

  brookmeyer_crowley:
    symbol: "a"
    text: "95% CI for median computed using Brookmeyer-Crowley method."

  km_estimates:
    symbol: "b"
    text: "Based on Kaplan-Meier estimates."

  stratified_cox:
    symbol: "c"
    text: "HR from stratified Cox model; stratification factors: country/region, sex, disease status, ECOG PS."

  hr_interpretation:
    symbol: "d"
    text: "HR < 1 favors CT-P16."

  ada_definition:
    symbol: "a"
    text: "ADA-positive defined as subjects with treatment-emergent ADA or treatment-boosted ADA."

  nab_definition:
    symbol: "b"
    text: "NAb-positive defined as subjects with ADA-positive result and NAb-positive result."

  baseline_ada:
    symbol: "c"
    text: "Baseline is defined as the last non-missing value prior to first dose."

