# =============================================================================
# AESI CATEGORIES (Bevacizumab-specific)
# =============================================================================

aesi_categories:
  - category: "Hypersensitivity/Infusion-Related Reactions"
    soc_filter: "AESI_HYPERSENS = 'Y'"
  - category: "Hypertension"
    soc_filter: "AESI_HYPERT = 'Y'"
  - category: "Proteinuria"
    soc_filter: "AESI_PROTEIN = 'Y'"
  - category: "Hemorrhages"
    soc_filter: "AESI_HEMORR = 'Y'"
  - category: "Arterial Thromboembolic Events"
    soc_filter: "AESI_ATE = 'Y'"
  - category: "Venous Thromboembolic Events"
    soc_filter: "AESI_VTE = 'Y'"
  - category: "Gastrointestinal Perforations and Fistulae"
    soc_filter: "AESI_GIPERF = 'Y'"
  - category: "Wound Healing Complications"
    soc_filter: "AESI_WOUND = 'Y'"
  - category: "Posterior Reversible Encephalopathy Syndrome (PRES)"
    soc_filter: "AESI_PRES = 'Y'"
  - category: "Congestive Heart Failure"
    soc_filter: "AESI_CHF = 'Y'"
  - category: "Ovarian Failure/Fertility"
    soc_filter: "AESI_OVARIAN = 'Y'"

# =============================================================================
# PROGRAMMING NOTES TEMPLATES
# =============================================================================

programming_notes:
  teae_counting:
    - "Count subjects, not events"
    - "Subject counted once per category regardless of number of events"
    - "Percentages based on N in column header (population count)"
    - "Use worst grade for severity categorization"

  orr_analysis:
    - "BOR derived from ADRS where PARAMCD = 'BOR'"
    - "ORR = (n CR + n PR) / N evaluable"
    - "Use PROC FREQ with EXACT BINOMIAL option for CI"
    - "Risk difference CI by Newcombe method"

  tte_analysis:
    - "Use PROC LIFETEST for KM estimates"
    - "Use PROC PHREG for stratified Cox model"
    - "Time in months: AVAL / 30.4375"
    - "Censoring per protocol-defined hierarchy"
    - "Stratification factors from ADSL: STRESSION, SEXN, DISSTATN, ECOGPSN"

  ada_analysis:
    - "Treatment-emergent: negative at baseline, positive post-baseline"
    - "Treatment-boosted: positive at baseline with ≥4-fold increase"
    - "Titer summarized using geometric mean and CV%"
    - "Use PROC FREQ for incidence, PROC MEANS for titer"
