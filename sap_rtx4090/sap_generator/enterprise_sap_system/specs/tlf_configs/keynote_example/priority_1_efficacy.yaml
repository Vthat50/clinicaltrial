# KEYNOTE-EXAMPLE Priority 1 Efficacy TLF Shells
# ================================================
# Immuno-Oncology Study: Pembrolizumab + Chemo vs Placebo + Chemo
# Primary Endpoints: PFS, OS

metadata:
  study: "KEYNOTE-EXAMPLE"
  study_type: "immuno_oncology"
  indication: "Non-Small Cell Lung Cancer (NSCLC)"
  priority: 1
  category: "Efficacy"
  sap_sections: ["8.1", "8.2"]

# Inherit from IO base
base_config: "../core/base_immuno_oncology.yaml"

# AESI profile for this study
aesi_profile:
