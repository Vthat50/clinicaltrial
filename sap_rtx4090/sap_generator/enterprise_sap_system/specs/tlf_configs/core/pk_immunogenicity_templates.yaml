# =============================================================================
# PHARMACOKINETIC & IMMUNOGENICITY TABLE TEMPLATES
# =============================================================================
# PK and Immunogenicity analyses are often overlooked in planning-stage shells
# but are critical for biologics, biosimilars, and combination therapies.
#
# This module provides comprehensive templates for:
# - PK parameter summaries (Cmax, Ctrough, AUC, etc.)
# - Concentration-time profiles
# - ADA incidence and impact
# - Neutralizing antibody (NAb) analysis
# =============================================================================

# -----------------------------------------------------------------------------
# PHARMACOKINETIC TABLE TEMPLATES
# -----------------------------------------------------------------------------

pk_tables:

  # ---------------------------------------------------------------------------
  # Table: PK Parameters Summary
  # ---------------------------------------------------------------------------
  pk_parameters_summary:
    number_template: "14.4.1.1"
    title_template: "Summary of Pharmacokinetic Parameters ({drug_name}) ({population_name})"
    population: "pk_population"
    source_dataset: "ADPC"

    columns:
      - header: "PK Parameter"
        width: 2.5
        alignment: L
      - header: "{treatment_arm_1}\\n(N=xxx)"
        width: 1.5
        alignment: C
      - header: "{treatment_arm_2}\\n(N=xxx)"
        width: 1.5
        alignment: C
      - header: "Geometric Mean Ratio\\n[90% CI]"
        width: 2.0
        alignment: C
        note: "For biosimilar comparisons"

    stub_rows:
      - level: 0
        label: "Cmax (μg/mL)"
        bold: true
        row_type: header
      - level: 1
        label: "n"
        row_type: data
      - level: 1
        label: "Geometric Mean (CV%)"
        row_type: data
      - level: 1
        label: "Arithmetic Mean (SD)"
        row_type: data
      - level: 1
        label: "Median (Min, Max)"
        row_type: data
      - level: 0
        label: ""
        row_type: spacer
      - level: 0
        label: "Ctrough (μg/mL)"
        bold: true
        row_type: header
      - level: 1
        label: "n"
        row_type: data
      - level: 1
        label: "Geometric Mean (CV%)"
        row_type: data
      - level: 1
        label: "Arithmetic Mean (SD)"
        row_type: data
      - level: 1
        label: "Median (Min, Max)"
        row_type: data
      - level: 0
        label: ""
        row_type: spacer
      - level: 0
        label: "AUC0-τ (μg·day/mL)"
        bold: true
        row_type: header
        note: "If calculated"
      - level: 1
        label: "n"
        row_type: data
      - level: 1
        label: "Geometric Mean (CV%)"
        row_type: data
      - level: 1
        label: "Arithmetic Mean (SD)"
        row_type: data
      - level: 1
        label: "Median (Min, Max)"
        row_type: data
      - level: 0
        label: ""
        row_type: spacer
      - level: 0
        label: "Clearance (L/day)"
        bold: true
        row_type: header
        note: "If calculated from model"
      - level: 1
        label: "n"
        row_type: data
      - level: 1
        label: "Geometric Mean (CV%)"
        row_type: data
      - level: 1
        label: "Median (Min, Max)"
        row_type: data
      - level: 0
        label: ""
        row_type: spacer
      - level: 0
        label: "Volume of Distribution (L)"
        bold: true
        row_type: header
        note: "If calculated from model"
      - level: 1
        label: "n"
        row_type: data
      - level: 1
        label: "Geometric Mean (CV%)"
        row_type: data
      - level: 1
        label: "Median (Min, Max)"
        row_type: data
      - level: 0
        label: ""
        row_type: spacer
      - level: 0
        label: "t1/2 (days)"
        bold: true
        row_type: header
        note: "Terminal half-life"
      - level: 1
        label: "n"
        row_type: data
      - level: 1
        label: "Arithmetic Mean (SD)"
        row_type: data
      - level: 1
        label: "Median (Min, Max)"
        row_type: data

    footnotes:
      - symbol: ""
        text: "PK Population: All subjects who received study treatment and had at least one evaluable PK sample."
      - symbol: "a"
        text: "Cmax = maximum observed serum concentration."
      - symbol: "b"
        text: "Ctrough = serum concentration at end of dosing interval (predose)."
      - symbol: "c"
        text: "CV% = coefficient of variation as percentage."
      - symbol: "d"
        text: "PK parameters calculated using non-compartmental analysis."

    programming_notes:
      - "Use geometric mean for Cmax, Ctrough, AUC, CL, Vd"
      - "Use arithmetic mean for t1/2"
      - "CV% = 100 × √(exp(SD²) - 1) for log-transformed data"
      - "Calculate GMR and 90% CI for biosimilar comparisons"

  # ---------------------------------------------------------------------------
  # Table: Serum Concentrations by Visit
  # ---------------------------------------------------------------------------
  serum_concentrations_by_visit:
    number_template: "14.4.1.2"
    title_template: "Summary of Serum {drug_name} Concentrations by Visit ({population_name})"
    population: "pk_population"
    source_dataset: "ADPC"
    orientation: "LANDSCAPE"

    columns:
      - header: "Visit"
        width: 1.5
        alignment: L
      - header: "Timepoint"
        width: 1.2
        alignment: L
      - header: "{treatment_arm_1}\\nn\\nGeometric Mean (CV%)\\nMedian (Min, Max)"
        width: 2.0
        alignment: C
      - header: "{treatment_arm_2}\\nn\\nGeometric Mean (CV%)\\nMedian (Min, Max)"
        width: 2.0
        alignment: C

