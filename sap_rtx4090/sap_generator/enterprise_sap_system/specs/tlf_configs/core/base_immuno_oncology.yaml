# =============================================================================
# IMMUNO-ONCOLOGY BASE CONFIGURATION
# =============================================================================
# Extends: base_oncology.yaml
# For checkpoint inhibitor and other immunotherapy studies
#
# Key differentiators:
# - iRECIST criteria for response
# - irAE (immune-related AE) monitoring
# - Delayed/durable responses
# - Biomarker stratification (PD-L1, TMB, MSI)

version: "2.0"
config_type: "study_type_base"
extends: "base_oncology.yaml"
study_type: "immuno_oncology"

# =============================================================================
# IO-SPECIFIC CONCEPTS
# =============================================================================
io_framework:
  mechanism: "Immune checkpoint inhibition / T-cell activation"
  response_pattern: "May see pseudoprogression before true response"
  durability: "Responses often durable beyond treatment discontinuation"

# =============================================================================
# RESPONSE CRITERIA FOR IO
# =============================================================================
response_criteria:
  # Standard RECIST used as primary, iRECIST as supportive
  primary: "RECIST 1.1"
  supportive: "iRECIST"

  irecist:
    name: "iRECIST"
    full_name: "immune-related Response Evaluation Criteria In Solid Tumors"
    description: "Allows confirmation of progression to account for pseudoprogression"

    categories:
      - code: "iCR"
        label: "immune Complete Response"
        definition: "Disappearance of all lesions"
      - code: "iPR"
        label: "immune Partial Response"
        definition: "≥30% decrease confirmed"
      - code: "iSD"
        label: "immune Stable Disease"
        definition: "Neither iPR nor iCPD"
      - code: "iUPD"
        label: "immune Unconfirmed Progressive Disease"
        definition: "Initial progression; requires confirmation"
      - code: "iCPD"
        label: "immune Confirmed Progressive Disease"
        definition: "Progression confirmed ≥4 weeks later"

    key_concept: |
      Upon initial RECIST 1.1 progression:
      - Continue treatment if clinically stable
      - Repeat imaging in 4-8 weeks
      - If progression confirmed → iCPD
      - If no progression → reset baseline for iRECIST

# =============================================================================
# BIOMARKER STRATIFICATION
# =============================================================================
biomarkers:
  pdl1:
    name: "PD-L1 Expression"
    assays:
      - name: "22C3 pharmDx"
        platform: "Dako"
        used_for: ["Pembrolizumab"]
      - name: "28-8 pharmDx"
        platform: "Dako"
        used_for: ["Nivolumab"]
      - name: "SP142"
        platform: "Ventana"
        used_for: ["Atezolizumab"]
      - name: "SP263"
        platform: "Ventana"
        used_for: ["Durvalumab"]

    scoring:
      tps:
        name: "Tumor Proportion Score"
        definition: "% tumor cells with membrane staining"
        cutoffs: [1, 50]
        categories:
          - "TPS <1% (PD-L1 Negative)"
          - "TPS 1-49% (PD-L1 Low)"
          - "TPS ≥50% (PD-L1 High)"
      cps:
        name: "Combined Positive Score"
        definition: "(PD-L1+ tumor + immune cells) / total tumor cells × 100"
        cutoffs: [1, 10, 20]
      ic:
        name: "Immune Cell Score"
        definition: "% tumor area with PD-L1+ immune cells"
        cutoffs: [1, 5, 10]

  tmb:
    name: "Tumor Mutational Burden"
    units: "mutations/megabase"
    cutoffs:
      high: 10
      intermediate: [5, 10]
      low: "<5"
    assays:
      - "FoundationOne CDx"
      - "MSK-IMPACT"

  msi:
    name: "Microsatellite Instability"
    categories:
      - code: "MSI-H"
        label: "MSI-High"
      - code: "MSS"
        label: "Microsatellite Stable"
    assays:
      - "PCR-based"
      - "IHC for MMR proteins"
      - "NGS-based"

# =============================================================================
# IMMUNE-RELATED ADVERSE EVENTS (irAE)
# =============================================================================
irae:
  definition: |
    Adverse events with potential immunologic etiology requiring
    monitoring and/or immunosuppressive treatment.

  aesi_reference: "checkpoint_inhibitor"  # Reference to aesi_library.yaml

  management_principles:
    - "Early recognition critical"
    - "Corticosteroids are first-line treatment"
    - "Treatment hold for Grade 2, discontinue for Grade 3-4"
    - "May require additional immunosuppression (infliximab, MMF)"
    - "Endocrinopathies may require lifelong replacement"

  reporting_categories:
    - "Any irAE"
    - "Grade ≥3 irAE"
    - "irAE leading to discontinuation"
    - "irAE leading to death"
    - "irAE requiring systemic corticosteroids"
    - "irAE requiring high-dose corticosteroids (≥40mg prednisone equivalent)"

# =============================================================================
# TIME-TO-EVENT MODIFICATIONS
# =============================================================================
tte_considerations:
  pseudoprogression:
    description: "Initial tumor growth followed by response"
    handling:
      - "Continue treatment if clinically stable"
      - "Confirm progression per iRECIST"
      - "Sensitivity analysis using iRECIST"

  delayed_separation:
    description: "KM curves may not separate early"
    analysis:
      - "Milestone survival rates (12, 24, 36 months)"
      - "Restricted Mean Survival Time (RMST)"
      - "Weighted log-rank tests (Fleming-Harrington)"

  long_term_survivors:
    description: "Tail of survival curve may plateau"
    analysis:
      - "Landmark analyses"
      - "Cure-rate models"

# =============================================================================
# REQUIRED TABLE SHELLS FOR IO
# =============================================================================
required_tables:
  efficacy:
    - category: "Response by RECIST 1.1"
      endpoints: ["ORR", "BOR", "DCR"]
      by_biomarker: ["Overall", "PD-L1 subgroups"]

    - category: "Response by iRECIST"
      endpoints: ["iORR", "iBOR"]
      note: "Supportive analysis"

    - category: "Time-to-Event"
      endpoints: ["PFS", "OS", "DOR", "TTR"]
      by_biomarker: ["Overall", "PD-L1 subgroups", "TMB subgroups"]

    - category: "Landmark Survival"
      timepoints: [6, 12, 18, 24, 36]
      note: "Important for IO due to delayed separation"

  safety:
    - category: "TEAE Overview"
      stratifications: ["Any grade", "Grade ≥3"]

    - category: "irAE Summary"
      note: "Critical for IO"
      categories:
        - "Any irAE"
        - "By organ system (pneumonitis, colitis, hepatitis, etc.)"
        - "By grade"
        - "Leading to discontinuation"
        - "Requiring corticosteroids"

    - category: "AESI by Category"
      reference: "aesi_library.checkpoint_inhibitor"

    - category: "SAE"

    - category: "Deaths"

  biomarker:
    - "Efficacy by PD-L1 Status"
    - "Efficacy by TMB Status"
    - "Efficacy by MSI Status"
    - "Forest Plot by Biomarker Subgroups"

# =============================================================================
# COLUMN TEMPLATES FOR IO
# =============================================================================
column_templates:
  io_by_biomarker:
    - header: "Subgroup"
      width: 2.5
      alignment: L
    - header: "n/N"
      width: 0.8
      alignment: C
    - header: "ORR (%)\n[95% CI]"
      width: 1.5
      alignment: C
    - header: "Median PFS (mo)\n[95% CI]"
      width: 1.5
      alignment: C
    - header: "Median OS (mo)\n[95% CI]"
      width: 1.5
      alignment: C

  irae_summary:
    - header: "irAE Category"
      width: 3.5
      alignment: L
    - header: "{ARM1}\n(N=xxx)\nn (%)"
      width: 1.3
      alignment: C
    - header: "{ARM2}\n(N=xxx)\nn (%)"
      width: 1.3
      alignment: C

# =============================================================================
# FOOTNOTE TEMPLATES FOR IO
# =============================================================================
footnote_templates:
  response:
    recist: "Response assessed per RECIST 1.1."
    irecist: "Response assessed per iRECIST."
    pseudoprogression: "iRECIST allows for confirmation of progression to account for pseudoprogression."

  biomarker:
    pdl1_tps: "PD-L1 TPS: Tumor Proportion Score; % of tumor cells with PD-L1 membrane staining."
    pdl1_cps: "PD-L1 CPS: Combined Positive Score."
    tmb: "TMB: Tumor Mutational Burden; TMB-High defined as ≥10 mutations/megabase."

  irae:
    definition: "Immune-related AE: AE with potential immunologic etiology per investigator assessment."
    management: "irAE management per protocol-specified guidelines."
