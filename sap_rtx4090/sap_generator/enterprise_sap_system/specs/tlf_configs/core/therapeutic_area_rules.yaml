# =============================================================================
# THERAPEUTIC AREA RULES (auto-generated from INSTRUCTIONS.md files)
# =============================================================================
# DO NOT EDIT DIRECTLY. Edit the INSTRUCTIONS.md files in skills/
# and re-run: python skills/convert_to_yaml.py
# =============================================================================

version: '1.0'
config_type: therapeutic_area_rules
description: Therapeutic-area-specific TLF rules derived from INSTRUCTIONS.md files.
  These supplement the core generation_rules.yaml with area-specific mandatory/common/conditional
  table types and clinical notes.
areas:
  biosimilar:
    reference_saps: 1
    notes:
    - Equivalence margins must be pre-specified and justified — include in table footnotes
    - 'Risk difference method: Miettinen-Nurminen for binary endpoints'
    - Tipping point analysis is a regulatory expectation for missing data sensitivity
    - Both Central and Local review required for tumor endpoints in oncology biosimilars
    - PK/immunogenicity tables should be split by treatment period when multiple periods
      exist
    - Drug-related TEAEs and drug-related Grade ≥3 TEAEs are standard biosimilar safety
      subsets
    - ADA status stratification of safety data is expected
    - Concomitant medications should be reported by study period
    - Prior cancer therapy should be broken down by modality (surgical, radiation,
      systemic) with systemic further split by drug class
    - Salvage/subsequent therapy tracking is important for long-term follow-up
  cardiovascular_metabolic:
    reference_saps: 6
    notes:
    - MACE composite endpoint analysis is common (MI, stroke, CV death)
    - QTc analysis tables (absolute values and change from baseline) when ECG collected
    - Holter monitoring tables when continuous ECG performed
    - Lipid panel tables are common in metabolic trials
    - Blood pressure categorization tables (hypertension staging)
    - Hierarchical testing procedures for multiple primary endpoints
    common_table_types:
    - type: demographics
      frequency: 50%
    conditional_table_types:
    - type: baseline
      frequency: 33%
    - type: efficacy_continuous
      frequency: 33%
    - type: efficacy_tte
      frequency: 33%
    - type: labs_summary
      frequency: 17%
      condition: facts.assessments_collected.labs == true
    - type: aesi
      frequency: 17%
      condition: facts.aesis | length > 0
    - type: pk_concentration
      frequency: 17%
      condition: facts.assessments_collected.pk == true
    - type: ae_overview
      frequency: 17%
    - type: medical_history
      frequency: 17%
    - type: efficacy_binary
      frequency: 17%
    figure_types:
    - type: mean_change_over_time_plot
      frequency: 33%
    - type: consort_/_disposition_diagram
      frequency: 33%
    - type: pk_concentration-time_profile
      frequency: 17%
    - type: other_figures
      frequency: 17%
    - type: km_plot
      frequency: 17%
    - type: forest_plot
      frequency: 17%
  dermatology:
    reference_saps: 4
    notes:
    - EASI, IGA, BSA are standard efficacy endpoints for atopic dermatitis
    - PASI is standard for psoriasis
    - PRO instruments are common (POEM, DLQI, itch NRS)
    - Photo documentation may require additional assessments
