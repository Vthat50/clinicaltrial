thod", "shape": "dot", "size": 25, "title": "Kaplan-Meier Method\n\nNon-parametric estimator of survival function. Handles censored data. Standard for TTE endpoints.\n\nSource: Kaplan \u0026 Meier, JASA 1958"}, {"color": "#3498db", "font": {"color": "white"}, "id": "COX_PH", "label": "Cox Proportional Hazards Model", "shape": "dot", "size": 25, "title": "Cox Proportional Hazards Model\n\nSemi-parametric regression for hazard ratios. Allows covariate adjustment. Assumes proportional hazards.\n\nSource: Cox, JRSSB 1972"}, {"color": "#3498db", "font": {"color": "white"}, "id": "LOG_RANK", "label": "Log-Rank Test", "shape": "dot", "size": 25, "title": "Log-Rank Test\n\nNon-parametric test for comparing survival curves. Optimal under proportional hazards.\n\nSource: Mantel, Cancer Chemotherapy Reports 1966"}, {"color": "#3498db", "font": {"color": "white"}, "id": "CMH", "label": "Cochran-Mantel-Haenszel Test", "shape": "dot", "size": 25, "title": "Cochran-Mantel-Haenszel Test\n\nStratified analysis of 2x2 tables. Controls for confounding factors.\n\nSource: Cochran 1954; Mantel \u0026 Haenszel 1959"}, {"color": "#3498db", "font": {"color": "white"}, "id": "CLOPPER_PEARSON", "label": "Clopper-Pearson Exact CI", "shape": "dot", "size": 25, "title": "Clopper-Pearson Exact CI\n\nExact binomial confidence interval. Conservative coverage. Standard for response rates.\n\nSource: Clopper \u0026 Pearson, Biometrika 1934"}, {"color": "#3498db", "font": {"color": "white"}, "id": "MMRM", "label": "Mixed Model Repeated Measures", "shape": "dot", "size": 25, "title": "Mixed Model Repeated Measures\n\nLikelihood-based analysis of longitudinal data. Handles missing data under MAR assumption.\n\nSource: Mallinckrodt et al., 2008"}, {"color": "#3498db", "font": {"color": "white"}, "id": "NCA", "label": "Non-Compartmental Analysis", "shape": "dot", "size": 25, "title": "Non-Compartmental Analysis\n\nModel-independent PK analysis. Calculates AUC, Cmax from concentration-time data.\n\nSource: FDA BE Guidance"}, {"color": "#3498db", "font": {"color": "white"}, "id": "ANOVA", "label": "Analysis of Variance", "shape": "dot", "size": 25, "title": "Analysis of Variance\n\nComparison of means across groups. Linear model framework.\n\nSource: Fisher, 1925"}, {"color": "#2ecc71", "font": {"color": "white"}, "id": "HR", "label": "Hazard Ratio", "shape": "dot", "size": 25, "title": "Hazard Ratio\n\nRatio of hazard rates between treatment groups. HR\u003c1 favors treatment. Derived from Cox model.\n\nSource: Cox Model"}, {"color": "#2ecc71", "font": {"color": "white"}, "id": "OR", "label": "Odds Ratio", "shape": "dot", "size": 25, "title": "Odds Ratio\n\nRatio of odds of event between groups. Used for rare events and case-control studies.\n\nSource: Epidemiology"}, {"color": "#2ecc71", "font": {"color": "white"}, "id": "RR", "label": "Risk Ratio", "shape": "dot", "size": 25, "title": "Risk Ratio\n\nRatio of event probabilities. More interpretable than OR for common events.\n\nSource: Epidemiology"}, {"color": "#2ecc71", "font": {"color": "white"}, "id": "RD", "label": "Risk Difference", "shape": "dot", "size": 25, "title": "Risk Difference\n\nAbsolute difference in event probabilities. Useful for NNT calculation.\n\nSource: Epidemiology"}, {"color": "#2ecc71", "font": {"color": "white"}, "id": "GMR", "label": "Geometric Mean Ratio", "shape": "dot", "size": 25, "title": "Geometric Mean Ratio\n\nRatio of geometric means. Standard for PK parameters (AUC, Cmax).\n\nSource: FDA BE Guidance"}, {"color": "#9b59b6", "font": {"color": "white"}, "id": "ITT", "label": "Intent-to-Treat Population", "shape": "dot", "size": 25, "title": "Intent-to-Treat Population\n\nAll randomized patients analyzed as randomized. Preserves randomization. Primary for efficacy.\n\nSource: ICH E9"}, {"color": "#9b59b6", "font": {"color": "white"}, "id": "mITT", "label": "Modified Intent-to-Treat", "shape": "dot", "size": 25, "title": "Modified Intent-to-Treat\n\nITT with additional requirements YPOTHETICAL", "label": "Hypothetical Strategy", "shape": "dot", "size": 25, "title": "Hypothetical Strategy\n\nEstimate effect if ICE had not occurred. Requires causal assumptions.\n\nSource: ICH E9(R1)"}, {"color": "#e67e22", "font": {"color": "white"}, "id": "ICE_PRINCIPAL_STRATUM", "label": "Principal Stratum Strategy", "shape": "dot", "size": 25, "title": "Principal Stratum Strategy\n\nEffect in subgroup where ICE would not occur regardless of treatment.\n\nSource: ICH E9(R1)"}, {"color": "#e67e22", "font": {"color": "white"}, "id": "ICE_WHILE_ON_TREATMENT", "label": "While on Treatment Strategy", "shape": "dot", "size": 25, "title": "While on Treatment Strategy\n\nOutcome assessed only during active treatment period.\n\nSource: ICH E9(R1)"}]);

SITE", "label": "defined_in", "title": "Composite strategy from ICH E9(R1)", "to": "ICH_E9R1"}, {"arrows": "to", "from": "ICE_HYPOTHETICAL", "label": "defined_in", "title": "Hypothetical strategy from ICH E9(R1)", "to": "ICH_E9R1"}, {"arrows": "to", "from": "ICE_PRINCIPAL_STRATUM", "label": "defined_in", "title": "Principal stratum from ICH E9(R1)", "to": "ICH_E9R1"}, {"arrows": "to", "from": "ICE_WHILE_ON_TREATMENT", "label": "defined_in", "title": "While on treatment from ICH E9(R1)", "to": "ICH_E9R1"}]);

                  var options = {
