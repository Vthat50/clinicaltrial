        comparison_only: true

    footnotes:
      - "Poisson regression with log(exposure) as offset."
      - "Check for overdispersion; use negative binomial if present."

    programming_notes:
      - "PROC GENMOD with DIST=POISSON LINK=LOG"
      - "SCALE=DEVIANCE if overdispersion detected"


# =============================================================================
# NON-INFERIORITY / EQUIVALENCE ANALYSES
# =============================================================================

non_inferiority:

  # ---------------------------------------------------------------------------
  # NI for Binary Endpoint
  # ---------------------------------------------------------------------------
  ni_binary:
    description: "Non-inferiority analysis for binary endpoint"
    applicable_to: ["ORR_NI", "response_rate_NI", "conversion_rate_NI"]
    adam_dataset: "ADRS"
    orientation: "PORTRAIT"

    column_structure: "two_arm"

    rows:
      - label: "Evaluable subjects, N"
        type: "data"
        format: "count"
        indent: 0
      - label: "Responders, n (%)"
        type: "data"
        format: "count_pct"
        indent: 0
      - label: "[95% CI]"
        type: "data"
        format: "ci_95"
        indent: 1
      - label: ""
        type: "spacer"
      - label: "Non-Inferiority Assessment"
        type: "header"
        bold: true
        indent: 0
      - label: "Risk Difference [95% CI]"
        type: "data"
        format: "diff_ci"
        indent: 1
        comparison_only: true
      - label: "Risk Ratio [95% CI]"
        type: "data"
        format: "ratio_ci"
        indent: 1
        comparison_only: true
        optional: true
      - label: "NI margin"
        type: "data"
        format: "fixed"
        indent: 1
      - label: "NI conclusion"
        type: "data"
        format: "text"
        indent: 1
        note: "NI demonstrated if lower bound of CI > -margin"

    footnotes:
      - "ci_exact"
      - "ci_newcombe"
      - "Non-inferiority margin: -{MARGIN}."
      - "NI concluded if lower bound of 95% CI for risk difference > -{MARGIN}."

    programming_notes:
      - "PROC FREQ with RISKDIFF (NONINF) option"
      - "Margin from protocol/SAP"
      - "One-sided alpha = 0.025 equivalent to two-sided 95% CI"

  # ---------------------------------------------------------------------------
  # NI for Time-to-Event
  # ---------------------------------------------------------------------------
  ni_tte:
    description: "Non-inferiority analysis for time-to-event endpoint"
    applicable_to: ["PFS_NI", "OS_NI"]
    adam_dataset: "ADTTE"
    orientation: "PORTRAIT"

    column_structure: "two_arm"

    rows:
      - label: "Number of events, n (%)"
        type: "data"
        format: "count_pct"
        indent: 0
      - label: "Median [95% CI]"
        type: "data"
        format: "median_ci"
        indent: 0
      - label: ""
        type: "spacer"
      - label: "Non-Inferiority Assessment"
        type: "header"
        bold: true
        indent: 0
      - label: "Hazard Ratio [95% CI]"
        type: "data"
        format: "hr_ci"
        indent: 1
        comparison_only: true
      - label: "NI margin (HR)"
        type: "data"
        format: "fixed"
        indent: 1
      - label: "NI conclusion"
        type: "data"
        format: "text"
        indent: 1
        note: "NI demonstrated if upper bound of CI < margin"

    footnotes:
      - "cox"
      - "Non-inferiority margin: HR = {MARGIN}."
      - "NI concluded if upper bound of 95% CI for HR < {MARGIN}."

  # ---------------------------------------------------------------------------
  # Equivalence / Biosimilar
  # ---------------------------------------------------------------------------
  equivalence_binary:
    description: "Equivalence analysis for binary endpoint (biosimilar)"
    applicable_to: ["ORR_equivalence", "biosimilar_primary"]
    adam_dataset: "ADRS"
    orientation: "PORTRAIT"

    column_structure: "two_arm"

    rows:
      - label: "Evaluable subjects, N"
        type: "data"
        format: "count"
        indent: 0
      - label: "Responders, n (%)"
        type: "data"
        format: "count_pct"
        indent: 0
      - label: "[95% CI]"
        type: "data"
        format: "ci_95"
        indent: 1
      - label: ""
        type: "spacer"
      - label: "Equivalence Assessment"
        type: "header"
        bold: true
        indent: 0
      - label: "Risk Difference [90% CI]"
        type: "data"
        format: "diff_ci"
        indent: 1
        comparison_only: true
      - label: "Risk Ratio [90% CI]"
        type: "data"
        format: "ratio_ci"
        indent: 1
        comparison_only: true
      - label: "Equivalence margins"
        type: "data"
        format: "fixed"
        indent: 1
      - label: "Equivalence conclusion"
        type: "data"
        format: "text"
        indent: 1

    footnotes:
      - "Equivalence concluded if 90% CI for risk difference lies within [{LOWER}, {UPPER}]."
      - "90% CI corresponds to two one-sided tests at alpha = 0.05."

    programming_notes:
      - "PROC FREQ with EQUIV option or TOST procedure"
      - "90% CI = two one-sided alpha 0.05"
      - "Margins from protocol/regulatory agreement"


