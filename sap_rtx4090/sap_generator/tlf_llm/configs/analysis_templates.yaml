# =============================================================================
# ANALYSIS TEMPLATES
# =============================================================================
# Maps statistical analysis methods to complete TLF shell structures.
# Each template defines everything needed to render a table shell:
#   - rows (with hierarchy, formatting, and display type)
#   - column structure
#   - associated figures
#   - footnotes
#   - source dataset and filter
#   - programming notes
#   - sensitivity analysis variants
#
# This file is therapeutic-area-agnostic. Disease-specific row labels
# (e.g., RECIST categories) come from therapeutic_areas/*.yaml configs.
#
# Used by the shell assembler after Claude identifies which analyses
# the study needs.
# =============================================================================

version: "1.0"
config_type: "analysis_templates"


# =============================================================================
# TIME-TO-EVENT ANALYSES
# =============================================================================

time_to_event:

  # ---------------------------------------------------------------------------
  # Cox Proportional Hazards (primary method for most TTE endpoints)
  # ---------------------------------------------------------------------------
  cox_ph:
    description: "Cox proportional hazards model with KM estimation"
    applicable_to: ["PFS", "OS", "DFS", "EFS", "DOR", "TTP", "TTF", "TTR", "RFS"]
    adam_dataset: "ADTTE"
    orientation: "PORTRAIT"

    column_structure: "two_arm"

    rows:
      - label: "Number of subjects"
        type: "data"
        format: "count"
        bold: false
        indent: 0
      - label: "Number of events, n (%)"
        type: "data"
        format: "count_pct"
        bold: false
        indent: 0
      - label: "Number censored, n (%)"
        type: "data"
        format: "count_pct"
        bold: false
        indent: 0
      - label: ""
        type: "spacer"
      - label: "Kaplan-Meier Estimates"
        type: "header"
        bold: true
        indent: 0
      - label: "25th percentile [95% CI]"
        type: "data"
        format: "median_ci"
        indent: 1
      - label: "Median [95% CI]"
        type: "data"
        format: "median_ci"
        indent: 1
      - label: "75th percentile [95% CI]"
        type: "data"
        format: "median_ci"
        indent: 1
      - label: ""
        type: "spacer"
      - label: "Landmark Rates [95% CI]"
        type: "header"
        bold: true
        indent: 0
      - label: "6-month rate [95% CI]"
        type: "data"
        format: "rate_ci"
        indent: 1
        optional: true
      - label: "12-month rate [95% CI]"
        type: "data"
        format: "rate_ci"
        indent: 1
        optional: true
      - label: "24-month rate [95% CI]"
        type: "data"
        format: "rate_ci"
        indent: 1
        optional: true
      - label: ""
        type: "spacer"
      - label: "Number at Risk"
        type: "header"
        bold: true
        indent: 0
        optional: true
      - label: "At 6 months"
        type: "data"
        format: "count"
        indent: 1
        optional: true
      - label: "At 12 months"
        type: "data"
        format: "count"
        indent: 1
        optional: true
      - label: "At 24 months"
        type: "data"
        format: "count"
        indent: 1
        optional: true
      - label: ""
        type: "spacer"
      - label: "Treatment Comparison"
        type: "header"
        bold: true
        indent: 0
      - label: "Hazard Ratio [95% CI]"
        type: "data"
        format: "hr_ci"
        indent: 1
        comparison_only: true
      - label: "P-value (stratified log-rank)"
        type: "data"
        format: "p_value"
        indent: 1
        comparison_only: true

    footnotes:
      - "km"
      - "cox"
      - "cox_favor"
      - "stratified"

    programming_notes:
      - "Use PROC LIFETEST for KM estimates"
      - "Use PROC PHREG for Cox model"
      - "Stratification factors per randomization"
      - "Ties handled by Efron method"
      - "95% CI for median by Brookmeyer-Crowley (Klein-Moeschberger also acceptable)"
      - "95% CI for rates by Greenwood formula with log-log transformation"

    figures:
      - type: "kaplan_meier"
        title: "Kaplan-Meier Plot of {ENDPOINT}"
        elements:
          - "Survival curves by treatment arm"
          - "Number at risk table below x-axis"
          - "Median lines (dashed)"
          - "95% CI shading (optional)"
          - "Censoring tick marks"
          - "HR [95% CI] and p-value annotation"
        programming_notes:
          - "Use PROC LIFETEST with ODS GRAPHICS"
          - "X-axis: Time (months), Y-axis: Probability"
          - "Include number at risk at each tick mark"

      - type: "forest_plot"
        title: "Subgroup Analysis Forest Plot - {ENDPOINT}"
        elements:
          - "Subgroup labels (left)"
          - "n/N per arm"
          - "HR [95% CI] per subgroup"
          - "Graphical CI bars with diamond for overall"
          - "Vertical reference line at HR=1"
          - "Interaction p-values"
          - "Favors labels below plot"
        programming_notes:
          - "Use PROC SGPLOT or custom macro"
          - "Subgroups from protocol pre-specification"
          - "Unstratified Cox within each subgroup"

    sensitivity_variants:
      unstratified:
        description: "Unstratified Cox model"
        changes:
          - row: "P-value (stratified log-rank)"
            new_label: "P-value (unstratified log-rank)"
          - footnote_remove: "stratified"
        programming_notes:
          - "Remove STRATA statement from PROC PHREG"

      per_protocol:
        description: "Per-protocol population analysis"
        changes:
          - filter: "PPROTFL = 'Y'"
          - footnote_add: "Per-Protocol Population."

      additional_covariates:
        description: "Cox model with additional covariates"
        additional_rows:
          - label: "Adjusted Hazard Ratio [95% CI]"
            type: "data"
            format: "hr_ci"
            indent: 1
        programming_notes:
          - "Include pre-specified covariates in MODEL statement"

  # ---------------------------------------------------------------------------
  # Restricted Mean Survival Time (RMST)
  # ---------------------------------------------------------------------------
  rmst:
    description: "Restricted mean survival time analysis"
    applicable_to: ["PFS", "OS", "DFS", "EFS"]
    adam_dataset: "ADTTE"
    orientation: "PORTRAIT"

    column_structure: "two_arm"

    rows:
      - label: "Number of subjects"
        type: "data"
        format: "count"
        indent: 0
      - label: "Number of events, n (%)"
        type: "data"
        format: "count_pct"
        indent: 0
      - label: ""
        type: "spacer"
      - label: "RMST at {TAU} months"
        type: "header"
        bold: true
        indent: 0
      - label: "RMST [95% CI]"
        type: "data"
        format: "mean_ci"
        indent: 1
      - label: ""
        type: "spacer"
      - label: "Treatment Comparison"
        type: "header"
        bold: true
        indent: 0
      - label: "Difference in RMST [95% CI]"
        type: "data"
        format: "diff_ci"
        indent: 1
        comparison_only: true
      - label: "Ratio of RMST [95% CI]"
        type: "data"
        format: "ratio_ci"
        indent: 1
        comparison_only: true
      - label: "P-value"
        type: "data"
        format: "p_value"
        indent: 1
        comparison_only: true

    footnotes:
      - "RMST calculated as area under KM curve up to restriction time {TAU}."
      - "95% CI based on pseudo-value approach."

    programming_notes:
      - "Use %RMST macro or PROC RMSTREG (SAS 9.4 TS1M7+)"
      - "Restriction time tau must be pre-specified"
      - "Consider when PH assumption is violated"

  # ---------------------------------------------------------------------------
  # Competing Risks (Fine-Gray / Cumulative Incidence)
  # ---------------------------------------------------------------------------
  competing_risks:
    description: "Competing risks analysis with cumulative incidence"
    applicable_to: ["disease_recurrence", "cause_specific_mortality", "graft_failure"]
    adam_dataset: "ADTTE"
    orientation: "PORTRAIT"

    column_structure: "two_arm"

    rows:
      - label: "Number of subjects"
        type: "data"
        format: "count"
        indent: 0
      - label: "Event of interest, n (%)"
        type: "data"
        format: "count_pct"
        indent: 0
      - label: "Competing event, n (%)"
        type: "data"
        format: "count_pct"
        indent: 0
      - label: "Censored, n (%)"
        type: "data"
        format: "count_pct"
        indent: 0
      - label: ""
        type: "spacer"
      - label: "Cumulative Incidence Estimates"
        type: "header"
        bold: true
        indent: 0
      - label: "6-month CIF [95% CI]"
        type: "data"
        format: "rate_ci"
        indent: 1
        optional: true
      - label: "12-month CIF [95% CI]"
        type: "data"
        format: "rate_ci"
        indent: 1
        optional: true
      - label: ""
        type: "spacer"
      - label: "Treatment Comparison"
        type: "header"
        bold: true
        indent: 0
      - label: "Subdistribution HR [95% CI]"
        type: "data"
        format: "hr_ci"
        indent: 1
        comparison_only: true
      - label: "P-value (Gray's test)"
        type: "data"
        format: "p_value"
        indent: 1
        comparison_only: true

    footnotes:
      - "Cumulative incidence function (CIF) estimated by Aalen-Johansen method."
      - "Subdistribution hazard ratio from Fine-Gray model."
      - "Gray's test for equality of CIFs."

    figures:
      - type: "cumulative_incidence"
        title: "Cumulative Incidence Plot - {ENDPOINT}"
        elements:
          - "CIF curves by treatment arm"
          - "Number at risk table"
          - "Competing event indicated"

    programming_notes:
      - "Use PROC LIFETEST with EVENTCODE option (SAS 9.4M5+)"
      - "Or use %CIF macro / R cmprsk package"
      - "Fine-Gray model via PROC PHREG with EVENTCODE"


# =============================================================================
# CATEGORICAL / BINARY RESPONSE ANALYSES
# =============================================================================

binary_response:

  # ---------------------------------------------------------------------------
  # Exact Binomial (Clopper-Pearson)
  # ---------------------------------------------------------------------------
  clopper_pearson:
    description: "Exact binomial proportion with Clopper-Pearson CI"
    applicable_to: ["ORR", "CR_rate", "DCR", "CBR", "responder_rate"]
    adam_dataset: "ADRS"
    orientation: "PORTRAIT"

    column_structure: "two_arm_total"

    rows:
      - label: "Evaluable subjects, N"
        type: "data"
        format: "count"
        indent: 0
      - label: ""
        type: "spacer"
      - label: "Responders, n (%)"
        type: "data"
        format: "count_pct"
        bold: true
        indent: 0
      - label: "[95% CI]"
        type: "data"
        format: "ci_95"
        indent: 1
      - label: ""
        type: "spacer"
      - label: "Non-responders, n (%)"
        type: "data"
        format: "count_pct"
        indent: 0
      - label: ""
        type: "spacer"
      - label: "Treatment Comparison"
        type: "header"
        bold: true
        indent: 0
      - label: "Difference [95% CI]"
        type: "data"
        format: "diff_ci"
        indent: 1
        comparison_only: true
      - label: "Odds Ratio [95% CI]"
        type: "data"
        format: "or_ci"
        indent: 1
        comparison_only: true
      - label: "P-value"
        type: "data"
        format: "p_value"
        indent: 1
        comparison_only: true

    footnotes:
      - "ci_exact"
      - "ci_newcombe"
      - "fisher"

    programming_notes:
      - "Use PROC FREQ with EXACT BINOMIAL for CI"
      - "Newcombe method for risk difference CI"
      - "Fisher's exact test or CMH for comparison"

    sensitivity_variants:
      stratified_cmh:
        description: "CMH test stratified by randomization factors"
        changes:
          - row: "P-value"
            new_label: "P-value (stratified CMH)"
          - footnote_add: "cmh"
        programming_notes:
          - "PROC FREQ with CMH option and STRATA"

  # ---------------------------------------------------------------------------
  # Logistic Regression
  # ---------------------------------------------------------------------------
  logistic_regression:
    description: "Logistic regression for binary endpoint with covariates"
    applicable_to: ["ORR", "responder_rate", "clinical_response"]
    adam_dataset: "ADRS"
    orientation: "PORTRAIT"

    column_structure: "two_arm"

    rows:
      - label: "Evaluable subjects, N"
        type: "data"
        format: "count"
        indent: 0
      - label: "Responders, n (%)"
        type: "data"
        format: "count_pct"
        indent: 0
      - label: "[95% CI]"
        type: "data"
        format: "ci_95"
        indent: 1
      - label: ""
        type: "spacer"
      - label: "Logistic Regression"
        type: "header"
        bold: true
        indent: 0
      - label: "Odds Ratio [95% CI]"
        type: "data"
        format: "or_ci"
        indent: 1
        comparison_only: true
      - label: "P-value"
        type: "data"
        format: "p_value"
        indent: 1
        comparison_only: true
      - label: ""
        type: "spacer"
      - label: "Covariates in Model"
        type: "header"
        bold: true
        indent: 0
        note: "List covariates from SAP"

    footnotes:
      - "logistic"
      - "ci_exact"

    programming_notes:
      - "Use PROC LOGISTIC"
      - "Include treatment and pre-specified covariates"
      - "Profile likelihood CI for OR"

  # ---------------------------------------------------------------------------
  # Ordinal Response (Proportional Odds)
  # ---------------------------------------------------------------------------
  proportional_odds:
    description: "Proportional odds model for ordinal categorical endpoint"
    applicable_to: ["ordinal_response", "severity_scale", "CGI_improvement"]
    adam_dataset: "ADEFF"
    orientation: "PORTRAIT"

    column_structure: "two_arm"

    rows:
      - label: "Evaluable subjects, N"
        type: "data"
        format: "count"
        indent: 0
      - label: ""
        type: "spacer"
      - label: "Response Distribution"
        type: "header"
        bold: true
        indent: 0
        note: "Categories from therapeutic area config"
      - label: ""
        type: "spacer"
      - label: "Proportional Odds Model"
        type: "header"
        bold: true
        indent: 0
      - label: "Common Odds Ratio [95% CI]"
        type: "data"
        format: "or_ci"
        indent: 1
        comparison_only: true
      - label: "P-value"
        type: "data"
        format: "p_value"
        indent: 1
        comparison_only: true

    footnotes:
      - "Proportional odds model (cumulative logit)."
      - "Score test for proportional odds assumption."

    programming_notes:
      - "Use PROC LOGISTIC with cumulative logit link"
      - "Test PO assumption with score test"


# =============================================================================
# CONTINUOUS ENDPOINT ANALYSES
# =============================================================================

continuous:

  # ---------------------------------------------------------------------------
  # ANCOVA (single timepoint)
  # ---------------------------------------------------------------------------
  ancova:
    description: "Analysis of covariance for change from baseline"
    applicable_to: ["change_from_baseline", "single_visit_continuous"]
    adam_dataset: "ADEFF"
    orientation: "PORTRAIT"

    column_structure: "two_arm"

    rows:
      - label: "Baseline"
        type: "header"
        bold: true
        indent: 0
      - label: "n"
        type: "data"
        format: "count"
        indent: 1
      - label: "Mean"
        type: "data"
        format: "mean"
        indent: 1
      - label: "SD"
        type: "data"
        format: "sd"
        indent: 1
      - label: "Median"
        type: "data"
        format: "mean"
        indent: 1
      - label: ""
        type: "spacer"
      - label: "Post-baseline (Week {X})"
        type: "header"
        bold: true
        indent: 0
      - label: "n"
        type: "data"
        format: "count"
        indent: 1
      - label: "Mean"
        type: "data"
        format: "mean"
        indent: 1
      - label: "SD"
        type: "data"
        format: "sd"
        indent: 1
      - label: ""
        type: "spacer"
      - label: "Change from Baseline"
        type: "header"
        bold: true
        indent: 0
      - label: "n"
        type: "data"
        format: "count"
        indent: 1
      - label: "Mean"
        type: "data"
        format: "mean"
        indent: 1
      - label: "SD"
        type: "data"
        format: "sd"
        indent: 1
      - label: ""
        type: "spacer"
      - label: "ANCOVA Results"
        type: "header"
        bold: true
        indent: 0
      - label: "LS Mean (SE)"
        type: "data"
        format: "mean_se"
        indent: 1
      - label: "LS Mean Difference [95% CI]"
        type: "data"
        format: "diff_ci"
        indent: 1
        comparison_only: true
      - label: "P-value"
        type: "data"
        format: "p_value"
        indent: 1
        comparison_only: true

    footnotes:
      - "ancova"
      - "ANCOVA model includes treatment, baseline value, and stratification factors as covariates."

    programming_notes:
      - "Use PROC GLM or PROC MIXED"
      - "MODEL: change = treatment baseline strat_factors"
      - "LSMEANS treatment / PDIFF CL"

  # ---------------------------------------------------------------------------
  # MMRM (repeated measures)
  # ---------------------------------------------------------------------------
  mmrm:
    description: "Mixed model for repeated measures"
    applicable_to: ["longitudinal_continuous", "repeated_measures", "PRO_over_time"]
    adam_dataset: "ADEFF"
    orientation: "LANDSCAPE"

    column_structure: "two_arm"
    by_visit: true

    rows:
      - label: "Baseline"
        type: "header"
        bold: true
        indent: 0
      - label: "n"
        type: "data"
        format: "count"
        indent: 1
      - label: "Mean"
        type: "data"
        format: "mean"
        indent: 1
      - label: "SD"
        type: "data"
        format: "sd"
        indent: 1
      - label: ""
        type: "spacer"
      - label: "Visit {X}"
        type: "header"
        bold: true
        indent: 0
        repeating: true
      - label: "n"
        type: "data"
        format: "count"
        indent: 1
        repeating: true
      - label: "LS Mean Change from Baseline (SE)"
        type: "data"
        format: "mean_se"
        indent: 1
        repeating: true
      - label: "LS Mean Difference vs {COMPARATOR} [95% CI]"
        type: "data"
        format: "diff_ci"
        indent: 1
        comparison_only: true
        repeating: true
      - label: "P-value"
        type: "data"
        format: "p_value"
        indent: 1
        comparison_only: true
        repeating: true

    footnotes:
      - "mmrm"
      - "MMRM: treatment, visit, treatment×visit interaction, baseline value, stratification factors."
      - "Unstructured covariance matrix. Kenward-Roger degrees of freedom."

    programming_notes:
      - "Use PROC MIXED or PROC GLIMMIX"
      - "MODEL: change = treatment visit treatment*visit baseline strat / DDFM=KR"
      - "REPEATED visit / SUBJECT=subject TYPE=UN"
      - "LSMEANS treatment*visit / PDIFF CL SLICE=visit"

    figures:
      - type: "ls_mean_plot"
        title: "LS Mean Change from Baseline Over Time - {ENDPOINT}"
        elements:
          - "LS mean ± SE by visit and treatment arm"
          - "Connecting lines between visits"
          - "X-axis: Study Visit, Y-axis: LS Mean Change"
          - "Error bars (SE or 95% CI)"
          - "Significance markers at each visit"
        programming_notes:
          - "Use PROC SGPLOT with SERIES and SCATTER"

    sensitivity_variants:
      pattern_mixture:
        description: "Pattern mixture model for MNAR sensitivity"
        additional_rows:
          - label: "Pattern Mixture Model"
            type: "header"
            bold: true
            indent: 0
          - label: "LS Mean Difference (delta = {X}) [95% CI]"
            type: "data"
            format: "diff_ci"
            indent: 1
        programming_notes:
          - "Multiple imputation under delta-adjusted MAR"
          - "Vary delta from 0 to protocol-specified maximum"

      tipping_point:
        description: "Tipping point analysis"
        additional_rows:
          - label: "Tipping Point Analysis"
            type: "header"
            bold: true
            indent: 0
          - label: "Delta at which conclusion changes"
            type: "data"
            format: "mean"
            indent: 1
        programming_notes:
          - "Systematically increase delta until p > 0.05"

  # ---------------------------------------------------------------------------
  # GEE (Generalized Estimating Equations)
  # ---------------------------------------------------------------------------
  gee:
    description: "GEE for correlated/clustered data"
    applicable_to: ["repeated_binary", "clustered_data", "correlated_outcomes"]
    adam_dataset: "ADEFF"
    orientation: "PORTRAIT"

    column_structure: "two_arm"

    rows:
      - label: "Number of subjects"
        type: "data"
        format: "count"
        indent: 0
      - label: "Number of observations"
        type: "data"
        format: "count"
        indent: 0
      - label: ""
        type: "spacer"
      - label: "GEE Results"
        type: "header"
        bold: true
        indent: 0
      - label: "Estimated Rate/Mean (SE)"
        type: "data"
        format: "mean_se"
        indent: 1
      - label: "Treatment Effect [95% CI]"
        type: "data"
        format: "diff_ci"
        indent: 1
        comparison_only: true
      - label: "P-value"
        type: "data"
        format: "p_value"
        indent: 1
        comparison_only: true

    footnotes:
      - "GEE with exchangeable (or specified) working correlation structure."
      - "Robust (sandwich) standard errors."

    programming_notes:
      - "Use PROC GENMOD with REPEATED statement"
      - "TYPE=EXCH or TYPE=UN for working correlation"


