# =============================================================================
# INTERIM ANALYSIS
# =============================================================================

interim:

  group_sequential:
    description: "Group sequential monitoring boundaries"
    adam_dataset: null
    orientation: "LANDSCAPE"

    column_structure: "custom"

    rows:
      - label: "Analysis"
        type: "header"
        bold: true
        indent: 0
      - label: "Interim Analysis 1"
        type: "data"
        indent: 0
      - label: "Interim Analysis 2"
        type: "data"
        indent: 0
        optional: true
      - label: "Final Analysis"
        type: "data"
        indent: 0

    custom_columns:
      - header: "Analysis"
        width: 1.5
      - header: "Information\nFraction"
        width: 1.0
        format: "xx.x%"
      - header: "Nominal\nAlpha (1-sided)"
        width: 1.0
        format: "x.xxxx"
      - header: "Cumulative\nAlpha"
        width: 1.0
        format: "x.xxxx"
      - header: "Efficacy\nBoundary (Z)"
        width: 1.0
        format: "x.xxxx"
      - header: "Futility\nBoundary (Z)"
        width: 1.0
        format: "x.xxxx"
      - header: "Efficacy\nBoundary (HR)"
        width: 1.0
        format: "x.xxx"
        optional: true

    footnotes:
      - "Alpha-spending function: Lan-DeMets with O'Brien-Fleming-type boundary."
      - "Futility boundaries are non-binding."
      - "Boundaries calculated using EAST {VERSION}."

    programming_notes:
      - "Use PROC SEQDESIGN / PROC SEQTEST"
      - "Or EAST software for boundary calculations"
      - "Document information fraction at each analysis"

