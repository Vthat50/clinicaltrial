      - label: "Poisson Model"
        type: "header"
        bold: true
        indent: 0
      - label: "Adjusted Rate [95% CI]"
        type: "data"
        format: "mean_ci"
        indent: 1
      - label: "Rate Ratio [95% CI]"
        type: "data"
        format: "ratio_ci"
        indent: 1
        comparison_only: true
      - label: "P-value"
        type: "data"
        format: "p_value"
