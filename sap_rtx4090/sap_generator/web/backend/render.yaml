# Render.com deployment configuration
# https://render.com/docs/blueprint-spec

services:
  - type: web
    name: sap-generator-api
    env: python
    region: oregon
    plan: free
    buildCommand: |
      pip install -r requirements.txt
      # Install R packages for boundary calculations
      R -e "install.packages(c('gsDesign', 'rpact'), repos='https://cloud.r-project.org', quiet=TRUE)" || echo "R packages installation skipped - will use scipy fallback"
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SUPABASE_URL
        sync: false  # Set manually in Render dashboard
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false
    healthCheckPath: /health
